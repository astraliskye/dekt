name: dekt
services:
  db:
    image: "postgres:latest"
    restart: unless-stopped
    container_name: "dekt-postgres"
    environment:
      POSTGRES_DB: dekt
      POSTGRES_USER: ${DEKT_POSTGRES_USER}
      POSTGRES_PASSWORD: ${DEKT_POSTGRES_PASSWORD}
    ports:
      - "5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app", "-d", "dekt"]
      interval: 5s
      timeout: 2s
      retries: 20

  app:
    container_name: "dekt-app"
    restart: unless-stopped
    env_file: .env
    build:
      context: .
      tags:
        - "astraliskye/dekt:latest"
    ports:
      - "8888:3000"
    depends_on:
      - db
volumes:
  dbdata:
